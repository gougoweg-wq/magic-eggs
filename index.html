<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Волшебные яйца</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#8fd3ff;font-family:Nunito,system-ui,sans-serif;color:#3b2a55;user-select:none;-webkit-user-select:none}
canvas{display:block;touch-action:none}
#top{position:fixed;left:50%;top:12px;transform:translateX(-50%);display:flex;gap:6px;background:rgba(255,255,255,.88);padding:8px 14px;border-radius:999px;box-shadow:0 4px 0 rgba(0,0,0,.12);align-items:center}
#top .e{font-size:26px;filter:grayscale(1) opacity(.45);transition:transform .3s}
#top .e.on{filter:none;transform:scale(1.15)}
#mute{position:fixed;right:12px;top:12px;font-size:24px;background:rgba(255,255,255,.88);border:0;border-radius:50%;width:48px;height:48px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.12)}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);font-size:22px;font-weight:900;color:#fff;text-shadow:0 2px 0 #7b4bb3,0 0 12px #7b4bb3;white-space:nowrap;pointer-events:none}
.panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);background:#fff;border-radius:28px;padding:22px 22px 18px;width:min(460px,92vw);box-shadow:0 10px 0 #c9b3ea,0 20px 60px rgba(60,20,100,.35);display:none;text-align:center;opacity:0;transition:transform .2s,opacity .2s}
.panel.on{display:block}
.panel.show{transform:translate(-50%,-50%) scale(1);opacity:1}
h2{margin:0 0 6px;font-size:26px;color:#7b4bb3}
.sub{font-size:16px;margin:0 0 12px;color:#6b5a85}
.ex{font-size:56px;font-weight:900;margin:6px 0 10px;letter-spacing:1px;color:#2d1f45}
.col{font-family:ui-monospace,Menlo,monospace;font-size:40px;font-weight:900;line-height:1.15;display:inline-block;text-align:right;margin:0 0 10px;color:#2d1f45}
.col .ln{border-top:4px solid #2d1f45}
.tools{display:flex;gap:8px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
.tool{border:0;background:#efe6fb;color:#7b4bb3;font:inherit;font-size:16px;padding:8px 14px;border-radius:999px;cursor:pointer}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{border:0;font:inherit;font-size:38px;font-weight:900;padding:14px 0;border-radius:20px;cursor:pointer;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .08s}
.opt:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.opt:nth-child(1){background:#ff7aa8}.opt:nth-child(2){background:#5ab8ff}.opt:nth-child(3){background:#ffb340}.opt:nth-child(4){background:#59cf7c}
.opt.no{background:#bbb!important;opacity:.5}
.opt.ok{outline:6px solid #ffe14d}
.msg{min-height:30px;font-size:22px;font-weight:900;margin-top:12px}
.msg.ok{color:#2fa64f}.msg.no{color:#e0527c}
.big{border:0;background:#ff7aa8;color:#fff;font:inherit;font-size:28px;font-weight:900;padding:14px 40px;border-radius:999px;cursor:pointer;box-shadow:0 6px 0 #d14f7d;margin-top:8px}
#start p{font-size:19px;line-height:1.5;color:#4b3a65}
</style>
</head>
<body>
<div id="top"></div>
<button id="mute" title="Звук (M)">🔊</button>
<div id="toast"></div>

<div class="panel on show" id="start">
  <h2>🥚 Волшебные яйца</h2>
  <p>На острове спрятались 6 волшебных яиц. Нажми на яйцо и реши пример — яйцо треснет. Реши ещё один — и кто-то вылупится!</p>
  <p>Одно яйцо лежит у лошадки в загоне 🐴, а золотое откроется последним 🌈</p>
  <button class="big" id="go">Играть!</button>
</div>

<div class="panel" id="qp">
  <h2 id="qt">Реши пример!</h2>
  <p class="sub" id="qs"></p>
  <div id="qview"></div>
  <div class="tools"><button class="tool" id="bcol">✏️ Столбиком</button><button class="tool" id="bsay">🔈 Прочитать</button><button class="tool" id="bclose">✖ Потом</button></div>
  <div class="opts" id="qo"></div>
  <div class="msg" id="qm"></div>
</div>

<div class="panel" id="win">
  <h2>🌙 Ура! Все малыши вылупились!</h2>
  <p class="sub" id="wtext"></p>
  <button class="big" id="again">Ещё раз!</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[rnd(0,a.length-1)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const lerp=(a,b,k)=>a+(b-a)*k;

// ---------- примеры ----------
// 1: сложение без перехода, 2: вычитание без перехода, 3: сложение с переходом,
// 4: вычитание с переходом, 5: трёхзначное + двузначное с переходом
function gen(level){
  let a,b,op;
  for(let k=0;k<200;k++){
    if(level===1){a=rnd(21,76);b=rnd(11,98-a);op='+';if(a%10+b%10<10&&a+b<100)break}
    else if(level===2){a=rnd(35,98);b=rnd(11,a-10);op='−';if(b%10<=a%10)break}
    else if(level===3){a=rnd(18,69);b=rnd(13,99-a);op='+';if(a%10+b%10>=10&&a+b<100)break}
    else if(level===4){a=rnd(41,95);b=rnd(12,a-11);op='−';if(b%10>a%10)break}
    else{a=rnd(124,868);b=rnd(16,89);op='+';if(a%10+b%10>=10&&a+b<1000)break}
  }
  const ans=op==='+'?a+b:a-b;
  const carry=level>=3;
  const cand=[carry?(op==='+'?ans-10:ans+10):ans+10,ans+1,ans-1,op==='+'?ans+10:ans-10,ans+2,ans-2];
  if(ans>=10&&ans<100&&ans%10!==0&&ans%10!==Math.floor(ans/10))cand.push(+(String(ans%10)+String(Math.floor(ans/10))));
  const wrong=[...new Set(cand)].filter(x=>x>0&&x!==ans);
  const opts=shuffle([ans,...wrong.slice(0,1).concat(shuffle(wrong.slice(1))).slice(0,3)]);
  return {a,b,op,ans,opts,level};
}
const STEPS=[1,2,1,3,2,3,4,3,4,4,5,5];

// ---------- текстуры ----------
function tex(draw,s=16){const c=document.createElement('canvas');c.width=c.height=s;const g=c.getContext('2d');draw(g,s);const t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;t.minFilter=THREE.NearestFilter;return t}
const noise=(g,pal)=>{for(let y=0;y<16;y++)for(let x=0;x<16;x++){g.fillStyle=pal[(Math.random()*pal.length)|0];g.fillRect(x,y,1,1)}};
const T={
  grass:tex(g=>noise(g,['#6fcf4a','#7ddb55','#62bf40','#86e05e'])),
  dirt:tex(g=>noise(g,['#9a6b45','#8c5f3c','#a6774f'])),
  side:tex(g=>{noise(g,['#9a6b45','#8c5f3c','#a6774f']);for(let x=0;x<16;x++){const h=3+(Math.random()*2|0);for(let y=0;y<h;y++){g.fillStyle=pick(['#6fcf4a','#7ddb55','#62bf40']);g.fillRect(x,y,1,1)}}}),
  sand:tex(g=>noise(g,['#f4e3a1','#efd98c','#f8eab5'])),
  log:tex(g=>{for(let x=0;x<16;x++){const c=pick(['#7a5534','#6b4a2c','#86603b']);for(let y=0;y<16;y++){g.fillStyle=c;g.fillRect(x,y,1,1)}}}),
  leaves:tex(g=>noise(g,['#3fae4a','#4cc157','#359a3f','#5bd065'])),
  pink:tex(g=>noise(g,['#ffb3d1','#ffa3c6','#ffc4dc','#ff9bc0'])),
  planks:tex(g=>{noise(g,['#f1c27d','#e8b46c','#f6cf8f']);g.fillStyle='#c48d4a';for(const y of[3,7,11,15])g.fillRect(0,y,16,1)}),
  roof:tex(g=>{noise(g,['#ff6b6b','#f25858','#ff8080']);g.fillStyle='#c94040';for(const y of[4,9,14])g.fillRect(0,y,16,1)}),
  hay:tex(g=>{noise(g,['#f2d15c','#e6c24a','#f8de78']);g.fillStyle='#c9a032';for(const y of[5,10])g.fillRect(0,y,16,1)}),
};
const L=(t)=>new THREE.MeshLambertMaterial({map:t});
const MAT={grass:[L(T.side),L(T.side),L(T.grass),L(T.dirt),L(T.side),L(T.side)],dirt:L(T.dirt),sand:L(T.sand),log:L(T.log),leaves:L(T.leaves),pink:L(T.pink),planks:L(T.planks),roof:L(T.roof),hay:L(T.hay)};

// ---------- рендер ----------
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0xcdeeff,50,110);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,400);
const hemi=new THREE.HemisphereLight(0xffffff,0x88aa77,.75);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff4e0,.7);sun.position.set(12,22,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.bias=-.0005;
Object.assign(sun.shadow.camera,{left:-13,right:13,top:13,bottom:-13,near:1,far:60});scene.add(sun);
const moon=new THREE.DirectionalLight(0x8fa0ff,0);moon.position.set(-10,18,-6);scene.add(moon);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

// небо
const DAY={top:new THREE.Color(0x4aa8ff),bot:new THREE.Color(0xd8f2ff)},NIGHT={top:new THREE.Color(0x0a0f33),bot:new THREE.Color(0x40306e)};
const skyU={top:{value:DAY.top.clone()},bot:{value:DAY.bot.clone()}};
const sky=new THREE.Mesh(new THREE.SphereGeometry(180,32,16),new THREE.ShaderMaterial({uniforms:skyU,side:THREE.BackSide,depthWrite:false,
  vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform vec3 top;uniform vec3 bot;varying vec3 vP;void main(){float h=normalize(vP).y;gl_FragColor=vec4(mix(bot,top,pow(clamp(h,0.,1.),.55)),1.);}'}));
scene.add(sky);
const sunDisc=new THREE.Mesh(new THREE.CircleGeometry(7,32),new THREE.MeshBasicMaterial({color:0xfff6c2,fog:false,transparent:true}));sunDisc.position.set(70,80,-110);sunDisc.lookAt(0,0,0);scene.add(sunDisc);
const moonDisc=new THREE.Mesh(new THREE.CircleGeometry(5,32),new THREE.MeshBasicMaterial({color:0xf3f0ff,fog:false,transparent:true,opacity:0}));moonDisc.position.set(-60,70,-110);moonDisc.lookAt(0,0,0);scene.add(moonDisc);
// звёзды
const starGeo=new THREE.BufferGeometry();{const p=[];for(let i=0;i<500;i++){const th=Math.random()*Math.PI*2,ph=Math.random()*Math.PI*.45;p.push(170*Math.sin(ph)*Math.cos(th),170*Math.cos(ph),170*Math.sin(ph)*Math.sin(th))}starGeo.setAttribute('position',new THREE.Float32BufferAttribute(p,3))}
const stars=new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xffffff,size:2.2,sizeAttenuation:false,transparent:true,opacity:0,fog:false,depthWrite:false}));scene.add(stars);

// вода
const waterGeo=new THREE.PlaneGeometry(160,160,64,64);waterGeo.rotateX(-Math.PI/2);
const wBase=waterGeo.attributes.position.array.slice();
const water=new THREE.Mesh(waterGeo,new THREE.MeshPhongMaterial({color:0x2fa8f5,specular:0xffffff,shininess:90,flatShading:true,transparent:true,opacity:.88}));water.position.y=.55;water.receiveShadow=true;scene.add(water);
const seabed=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshLambertMaterial({color:0xe8d690}));seabed.rotation.x=-Math.PI/2;seabed.position.y=-1;scene.add(seabed);
const foam=new THREE.Mesh(new THREE.RingGeometry(9.3,10.4,48),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.55}));foam.rotation.x=-Math.PI/2;foam.position.y=.62;scene.add(foam);

// ---------- остров ----------
const R=9.5,H={};const hk=(x,z)=>x+','+z;
const HILL=[-5,2];
const blocks={grass:[],dirt:[],sand:[],log:[],leaves:[],pink:[],planks:[],roof:[],hay:[]};
for(let x=-10;x<=10;x++)for(let z=-10;z<=10;z++){const d=Math.hypot(x,z);if(d>R)continue;
  let top=1;const dh=Math.hypot(x-HILL[0],z-HILL[1]);if(dh<2.6)top=2;if(dh<1.2)top=3;
  const beach=d>8.2;H[hk(x,z)]=top;
  for(let y=-1;y<top;y++)blocks[beach?'sand':(y===top-1?'grass':'dirt')].push([x,y,z]);}
const occupied=new Set(),paddock=new Set();
const PAD={x0:3,x1:7,z0:-4,z1:0};
for(let x=PAD.x0;x<=PAD.x1;x++)for(let z=PAD.z0;z<=PAD.z1;z++){if(x===PAD.x0||x===PAD.x1||z===PAD.z0||z===PAD.z1)occupied.add(hk(x,z));else paddock.add(hk(x,z))}
function tree(x,z,blossom){const t=H[hk(x,z)];for(let y=t;y<t+3;y++)blocks.log.push([x,y,z]);
  for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++)for(let y=t+2;y<t+4;y++)if(dx||dz||y>t+2)blocks[blossom?'pink':'leaves'].push([x+dx,y,z+dz]);
  blocks[blossom?'pink':'leaves'].push([x,t+4,z]);for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++)occupied.add(hk(x+dx,z+dz))}
tree(-6,-3,true);tree(6,4,false);tree(-3,6,true);tree(3,-7,false);tree(-7,4,false);
// домик
(function(){const x0=-2,z0=-6,t=1;for(let x=x0-1;x<=x0+3;x++)for(let z=z0-1;z<=z0+3;z++)occupied.add(hk(x,z));
  for(let x=x0;x<x0+3;x++)for(let z=z0;z<z0+3;z++)for(let y=t;y<t+2;y++)if(x===x0||x===x0+2||z===z0||z===z0+2){if(!(x===x0+1&&z===z0+2&&y===t))blocks.planks.push([x,y,z])}
  for(let x=x0-1;x<=x0+3;x++)for(let z=z0-1;z<=z0+3;z++)blocks.roof.push([x,t+2,z]);for(let x=x0;x<=x0+2;x++)for(let z=z0;z<=z0+2;z++)blocks.roof.push([x,t+3,z]);blocks.roof.push([x0+1,t+4,z0+1])})();
blocks.hay.push([6,1,-3]);
const box=new THREE.BoxGeometry(1,1,1);const m4=new THREE.Matrix4();
for(const k in blocks){const B=blocks[k];if(!B.length)continue;const im=new THREE.InstancedMesh(box,MAT[k],B.length);B.forEach((p,i)=>{m4.makeTranslation(p[0]+.5,p[1]+.5,p[2]+.5);im.setMatrixAt(i,m4)});im.receiveShadow=true;im.castShadow=!['grass','sand','dirt'].includes(k);scene.add(im)}
// забор загона
(function(){const wood=new THREE.MeshLambertMaterial({color:0xf3e6cf});const add=(w,h,d,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),wood);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m)};
  for(let x=PAD.x0;x<=PAD.x1;x++)for(let z=PAD.z0;z<=PAD.z1;z++)if(occupied.has(hk(x,z))&&(x===PAD.x0||x===PAD.x1||z===PAD.z0||z===PAD.z1))add(.18,.95,.18,x+.5,1.47,z+.5);
  const len=PAD.x1-PAD.x0;for(const y of[1.45,1.8]){add(len,.1,.08,(PAD.x0+PAD.x1)/2+.5,y,PAD.z0+.5);add(len,.1,.08,(PAD.x0+PAD.x1)/2+.5,y,PAD.z1+.5);
    add(.08,.1,PAD.z1-PAD.z0,PAD.x0+.5,y,(PAD.z0+PAD.z1)/2+.5);add(.08,.1,PAD.z1-PAD.z0,PAD.x1+.5,y,(PAD.z0+PAD.z1)/2+.5)}})();
occupied.add(hk(6,-3));
// цветочки
const flowerCols=[0xff5e8a,0xffd23f,0xffffff,0xb57bff,0xff8c42];const flowers=[];
const stemGeo=new THREE.BoxGeometry(.06,.3,.06),headGeo=new THREE.BoxGeometry(.18,.18,.18),stemMat=new THREE.MeshLambertMaterial({color:0x2f9a3a});
const flowerMats=flowerCols.map(c=>new THREE.MeshLambertMaterial({color:c}));
for(let i=0;i<70;i++){const x=rnd(-8,8),z=rnd(-8,8);if(Math.hypot(x,z)>7.8||occupied.has(hk(x,z))||paddock.has(hk(x,z)))continue;const t=H[hk(x,z)];if(t==null)continue;
  const f=new THREE.Group();const stem=new THREE.Mesh(stemGeo,stemMat);stem.position.y=.15;f.add(stem);const head=new THREE.Mesh(headGeo,pick(flowerMats));head.position.y=.33;f.add(head);
  f.position.set(x+.2+Math.random()*.6,t,z+.2+Math.random()*.6);f.userData.ph=Math.random()*6;scene.add(f);flowers.push(f)}
// облака
const cloudMat=new THREE.MeshLambertMaterial({color:0xffffff,transparent:true,opacity:.95});
const clouds=new THREE.Group();for(let i=0;i<10;i++){const c=new THREE.Group();for(let j=0;j<3;j++){const b=new THREE.Mesh(new THREE.BoxGeometry(rnd(3,6),1.2,rnd(2,4)),cloudMat);b.position.set(j*2-2,Math.random()*.5,Math.random()*1.5);c.add(b)}c.position.set(rnd(-40,40),rnd(14,20),rnd(-40,40));clouds.add(c)}scene.add(clouds);
const groundY=(x,z)=>{const t=H[hk(Math.floor(x),Math.floor(z))];return t==null?1:t};
const cellFree=(x,z,zone)=>{const k=hk(Math.floor(x),Math.floor(z));if(occupied.has(k)||blocked.has(k))return false;if(zone==='paddock')return paddock.has(k);return !paddock.has(k)&&H[k]===1&&Math.hypot(x,z)<7.6};
const blocked=new Set();

// бабочки
const butterflies=[];
(function(){const geo=new THREE.PlaneGeometry(.3,.24);geo.translate(.15,0,0);geo.rotateX(-Math.PI/2);
  [0xff8fd0,0xffd23f,0x8fd0ff,0xb57bff,0xffffff,0xff9b4d].forEach((c,i)=>{const m=new THREE.MeshLambertMaterial({color:c,side:THREE.DoubleSide});const g=new THREE.Group();
    const r=new THREE.Mesh(geo,m),l=new THREE.Mesh(geo,m);l.scale.x=-1;g.add(r,l);const body=new THREE.Mesh(new THREE.BoxGeometry(.05,.05,.22),new THREE.MeshLambertMaterial({color:0x3b2a55}));g.add(body);
    scene.add(g);butterflies.push({g,r,l,cx:rnd(-5,5),cz:rnd(-5,5),rad:2+Math.random()*3,sp:.25+Math.random()*.25,ph:Math.random()*6,y:2+Math.random()*1.5})})})();
// светлячки
const ffGeo=new THREE.BufferGeometry();const ffBase=[];{const p=[];for(let i=0;i<60;i++){const a=Math.random()*Math.PI*2,r=Math.random()*8;const v=[Math.cos(a)*r,1.4+Math.random()*3,Math.sin(a)*r];ffBase.push(v);p.push(...v)}ffGeo.setAttribute('position',new THREE.Float32BufferAttribute(p,3))}
const fireflies=new THREE.Points(ffGeo,new THREE.PointsMaterial({color:0xfff27a,size:.22,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));scene.add(fireflies);

// ---------- яйца ----------
function eggTex(base,spot,cracks){return tex((g,s)=>{g.fillStyle=base;g.fillRect(0,0,s,s);g.fillStyle=spot;for(let i=0;i<14;i++){g.beginPath();g.arc(rnd(0,s),rnd(0,s),rnd(3,7),0,7);g.fill()}
  if(cracks){g.strokeStyle='#3b2a55';g.lineWidth=3;for(let c=0;c<cracks;c++){g.beginPath();let x=rnd(10,s-10),y=4+c*14;g.moveTo(x,y);for(let k=0;k<6;k++){x+=rnd(-10,10);y+=rnd(5,10);g.lineTo(x,y)}g.stroke()}}},64)}
const ICON={chick:'🐥',cat:'🐱',puppy:'🐶',pig:'🐷',pony:'🐴',unicorn:'🦄'};
const EGGS=[
  {pos:[1,4],base:'#fff4c9',spot:'#ffb3d1',animal:'chick',name:'Цыплёнок'},
  {pos:[5,-6],base:'#d9f2ff',spot:'#7cc8ff',animal:'cat',name:'Котёнок'},
  {pos:[-5,1],base:'#e6ffd9',spot:'#8fdc6c',animal:'puppy',name:'Щенок'},
  {pos:[3,6],base:'#ffe1ec',spot:'#ff8fb6',animal:'pig',name:'Поросёнок'},
  {pos:[4,-1],base:'#f5e6d6',spot:'#c98b55',animal:'pony',name:'Жеребёнок'},
  {pos:[0,0],base:'#ffd84d',spot:'#fff3a8',animal:'unicorn',name:'Единорог',gold:true},
];
const sparkGeo=new THREE.BoxGeometry(.07,.07,.07);
let eggs=[];
function makeEggs(){eggs.forEach(e=>{scene.remove(e.mesh);scene.remove(e.glow);e.sparks.forEach(s=>scene.remove(s))});blocked.clear();

  {const fp=ffGeo.attributes.position.array;ffBase.forEach((v,i)=>{fp[i*3]=v[0]+Math.sin(t*.7+i)*.6;fp[i*3+1]=v[1]+Math.sin(t*1.1+i*2)*.3;fp[i*3+2]=v[2]+Math.cos(t*.6+i)*.6});ffGeo.attributes.position.needsUpdate=true}
  // яйца
